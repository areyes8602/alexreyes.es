# panel-push — avisos Web Push del Centro de Mando
# Deploy:  cd workers/panel-push && npx wrangler deploy
# Secret:  npx wrangler secret put VAPID_PRIVATE   (te lo pasa Claude / está en tu gestor)
# El id del namespace KV es el de "panel-cm" (Cloudflare → Workers y Pages → KV).
name = "panel-push"
main = "worker.js"
compatibility_date = "2026-06-01"

[vars]
VAPID_PUBLIC = "BPABCM-v9dTAmuAq8Vp7bP-qrB50j-GI2TuIWUlAvgWfT7mM6UgJjtxZYCb_MHqz-pxIiwUWhqh-ECcJosvCpQ8"

[[kv_namespaces]]
binding = "PANEL_KV"
id = "PON_AQUI_EL_ID_DEL_NAMESPACE_panel-cm"

[triggers]
# UTC: 05:30 y 18:30 → 07:30 y 20:30 hora de Madrid en verano (06:30/19:30 en invierno)
crons = ["30 5 * * *", "30 18 * * *"]
