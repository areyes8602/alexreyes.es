<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Fitxa d'alumne — Tutoria</title>
<script>(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);else document.documentElement.setAttribute('data-theme','light');})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  .fitxa { display:grid; grid-template-columns:180px 1fr; gap:1.8rem; align-items:start; }
  @media (max-width:640px) { .fitxa { grid-template-columns:1fr; } }
  .fitxa-foto { width:100%; aspect-ratio:127/192; object-fit:cover; border-radius:var(--radius);
    border:1px solid var(--border); background:var(--bg-subtle); display:block; }
  .fitxa-buit { display:flex; align-items:center; justify-content:center; font-size:3rem; color:var(--text-faint); }
  .camp { margin-bottom:1.4rem; }
  .camp label { display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--text-soft); margin-bottom:0.4rem; }
  .camp textarea, .camp input { width:100%; padding:0.6rem 0.75rem; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--bg); color:var(--text);
    font-size:0.94rem; font-family:inherit; line-height:1.55; }
  .camp textarea { min-height:190px; resize:vertical; }
  .camp textarea:focus, .camp input:focus { outline:none; border-color:#0f766e;
    box-shadow:0 0 0 3px rgba(15,118,110,.15); }
  .accions { display:flex; align-items:center; gap:1rem; }
  .btn { padding:0.6rem 1.2rem; border:0; border-radius:var(--radius-sm); cursor:pointer;
    background:#0f766e; color:#fff; font-size:0.92rem; font-weight:600; }
  .btn:hover { background:#0b5d56; }
  .btn[disabled] { opacity:.5; cursor:default; }
  .estat { font-size:0.86rem; color:var(--text-faint); }
  .estat.ok { color:#059669; } .estat.err { color:#dc2626; }
</style>
</head>
<body>
<main>
  <div class="container" style="padding-top:2.5rem;padding-bottom:4rem;max-width:820px">

    <div class="breadcrumb">
      <a href="/tutoria/">Tutoria 2n ESO E</a><span class="sep">/</span>
      <span class="current" id="bc">Fitxa</span>
    </div>

    <div id="cos" style="margin-top:1.5rem">
      <p style="color:var(--text-faint)">Carregant…</p>
    </div>

  </div>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const id = new URLSearchParams(location.search).get("id") || "";
const cos = document.getElementById("cos");

function pinta(a) {
  document.title = `${a.nom} ${a.cognoms} — Tutoria`;
  document.getElementById("bc").textContent = `${a.nom} ${a.cognoms}`;
  const foto = a.foto
    ? `<img class="fitxa-foto" src="/tutoria/api/foto?id=${encodeURIComponent(a.id)}" alt="">`
    : `<div class="fitxa-foto fitxa-buit" aria-hidden="true">👤</div>`;

  cos.innerHTML = `
    <div class="fitxa">
      <div>${foto}</div>
      <div>
        <span class="section-label">${esc(a.grup)} &middot; Curs ${esc(a.curs)}</span>
        <h1 style="margin:0.3rem 0 0.2rem;font-size:1.5rem">${esc(a.nom)}</h1>
        <p style="margin:0 0 1.4rem;color:var(--text-soft);font-size:1.05rem">${esc(a.cognoms)}</p>

        <div class="info-grid" style="margin-bottom:1.8rem">
          <div class="info-card"><div class="info-card-label">Nº de llista</div>
            <div class="info-card-value">${a.num}</div></div>
          <div class="info-card"><div class="info-card-label">Grup</div>
            <div class="info-card-value">${esc(a.grup)}</div></div>
          ${a.marca ? `<div class="info-card"><div class="info-card-label">Marca</div>
            <div class="info-card-value">${esc(a.marca)}</div></div>` : ""}
        </div>

        <div class="camp">
          <label for="contacte">Contacte de la família</label>
          <input id="contacte" type="text" value="${esc(a.contacte)}"
                 placeholder="Telèfon, correu, qui recull…">
        </div>

        <div class="camp">
          <label for="notes">Seguiment de tutoria</label>
          <textarea id="notes" placeholder="Entrevistes, acords, incidències, evolució…">${esc(a.notes)}</textarea>
        </div>

        <div class="accions">
          <button class="btn" id="desa">Desar</button>
          <span class="estat" id="estat">${a.updated_at ? "Última edició: " + esc(a.updated_at.slice(0,16).replace("T"," ")) : ""}</span>
        </div>
      </div>
    </div>`;

  document.getElementById("desa").addEventListener("click", desa);
}

async function desa() {
  const btn = document.getElementById("desa");
  const est = document.getElementById("estat");
  btn.disabled = true;
  est.className = "estat"; est.textContent = "Desant…";
  try {
    const r = await fetch("/tutoria/api/fitxa", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        id,
        contacte: document.getElementById("contacte").value,
        notes: document.getElementById("notes").value,
      }),
    });
    if (!r.ok) throw new Error(r.status === 401 ? "Sessió caducada" : "Error " + r.status);
    est.className = "estat ok"; est.textContent = "Desat";
  } catch (e) {
    est.className = "estat err"; est.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

if (!id) {
  cos.innerHTML = '<p>Falta l\'identificador. <a href="/tutoria/">Torna a l\'orla</a>.</p>';
} else {
  fetch("/tutoria/api/fitxa?id=" + encodeURIComponent(id), { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => pinta(d.alumne))
    .catch(err => {
      cos.innerHTML = err === 401
        ? '<p>La sessió ha caducat. <a href="/tutoria/">Torna a entrar</a>.</p>'
        : '<p>No s\'ha trobat l\'alumne. <a href="/tutoria/">Torna a l\'orla</a>.</p>';
    });
}
</script>
</body>
</html>
