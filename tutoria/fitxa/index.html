<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Fitxa d'alumne</title>
<script>(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);else document.documentElement.setAttribute('data-theme','light');})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  .cap { display:grid; grid-template-columns:150px 1fr; gap:1.6rem; align-items:start;
    padding-bottom:1.6rem; border-bottom:1px solid var(--border); margin-bottom:2rem; }
  @media (max-width:620px) { .cap { grid-template-columns:1fr; } }
  .cap-foto { width:100%; aspect-ratio:127/192; object-fit:cover; border-radius:var(--radius);
    border:1px solid var(--border); background:var(--bg-subtle); display:block; }
  .cap-buit { display:flex; align-items:center; justify-content:center; font-size:3rem;
    color:var(--text-faint); }
  .chips { display:flex; gap:.4rem; flex-wrap:wrap; margin:.5rem 0 0; }
  .chip { font-size:.7rem; font-family:var(--mono); padding:.15rem .45rem; border-radius:99px;
    border:1px solid currentColor; }
  .chip-r { color:#b45309; } .chip-p { color:#dc2626; } .chip-n { color:var(--text-faint); }

  /* Pestañas */
  .pestanyes { display:flex; gap:.15rem; flex-wrap:wrap; border-bottom:1px solid var(--border);
    margin-bottom:1.8rem; }
  .pestanyes button { padding:.55rem .9rem; border:0; background:none; color:var(--text-soft);
    font:inherit; font-size:.9rem; cursor:pointer; border-bottom:2px solid transparent;
    margin-bottom:-1px; display:flex; align-items:center; gap:.4rem; }
  .pestanyes button:hover { color:var(--text); }
  .pestanyes button[aria-selected="true"] { color:#0f766e; border-bottom-color:#0f766e;
    font-weight:600; }
  .pestanyes .avis-punt { width:6px; height:6px; border-radius:50%; background:#b45309; }
  .sec[hidden] { display:none; }

  /* Resumen de notas del traspaso */
  .resum { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1rem;
    padding:1rem; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg-subtle); margin-bottom:1.2rem; }
  .resum-dada { }
  .resum-dada .et { display:block; font-size:.68rem; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-faint); margin-bottom:.15rem; }
  .resum-dada .vl { font-family:var(--mono); font-size:1.35rem; font-weight:600; }
  .suspeses { grid-column:1/-1; font-size:.88rem; color:var(--text-soft); }
  .suspeses strong { color:#dc2626; }

  /* Casillas */
  .casella { display:flex; align-items:flex-start; gap:.6rem; padding:.6rem .75rem;
    border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); }
  .casella input { width:1.1rem; height:1.1rem; margin:.15rem 0 0; accent-color:#0f766e;
    flex:none; cursor:pointer; }
  .casella div { min-width:0; }
  .casella b { display:block; font-size:.92rem; font-weight:600; }
  .casella span { font-size:.8rem; color:var(--text-faint); line-height:1.4; }

  .sec { margin-bottom:2.4rem; }
  .sec > h2 { font-size:1.05rem; margin:0 0 .3rem; display:flex; align-items:baseline; gap:.5rem; }
  .sec > h2 .lb { font-size:.7rem; font-family:var(--mono); color:var(--text-faint);
    letter-spacing:.08em; text-transform:uppercase; font-weight:500; }
  .sec > p.ajut { margin:0 0 1rem; font-size:.86rem; color:var(--text-faint); }

  .graella { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; }
  .camp label { display:block; font-size:.7rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.05em; color:var(--text-soft); margin-bottom:.3rem; }
  .camp input, .camp textarea, .camp select { width:100%; padding:.55rem .7rem;
    border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg);
    color:var(--text); font:inherit; font-size:.93rem; line-height:1.55; }
  .camp textarea { min-height:120px; resize:vertical; }
  .camp input:focus, .camp textarea:focus, .camp select:focus { outline:none;
    border-color:#0f766e; box-shadow:0 0 0 3px rgba(15,118,110,.15); }
  .camp.ample { grid-column:1/-1; }

  /* Listas dinámicas: familia, entrevistas, incidencias */
  .item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:.8rem;
    margin-bottom:.7rem; background:var(--bg-subtle); }
  .item .graella { gap:.7rem; }
  .item-cap { display:flex; justify-content:space-between; align-items:center; margin-bottom:.6rem; }
  .item-cap span { font-size:.7rem; font-family:var(--mono); color:var(--text-faint);
    text-transform:uppercase; letter-spacing:.08em; }
  .treu { background:none; border:0; color:#dc2626; font-size:.8rem; cursor:pointer; padding:.2rem; }
  .afegeix { background:none; border:1px dashed var(--border); color:var(--text-soft);
    padding:.5rem 1rem; border-radius:var(--radius-sm); font:inherit; font-size:.86rem;
    cursor:pointer; width:100%; }
  .afegeix:hover { border-color:#0f766e; color:#0f766e; }

  /* Tabla de notas */
  .notes-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
  table.notes { border-collapse:collapse; width:100%; font-size:.9rem; min-width:26rem; }
  table.notes th { text-align:left; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-faint); font-weight:600; padding:.6rem .8rem; background:var(--bg-subtle);
    border-bottom:1px solid var(--border); }
  table.notes th.n, table.notes td.n { text-align:center; width:3.4rem;
    font-variant-numeric:tabular-nums; }
  table.notes td { padding:.45rem .8rem; border-bottom:1px solid var(--border); }
  table.notes tr:last-child td { border-bottom:none; }
  table.notes tr.destaca td { background:rgba(15,118,110,.07); font-weight:600; }
  table.notes td.n span { font-family:var(--mono); font-weight:600; }
  .n-sus { color:#dc2626; } .n-just { color:#b45309; } .n-be { color:var(--text); }
  .n-exc { color:#059669; } .n-cap { color:var(--text-faint); }

  .peu { position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--border);
    padding:.9rem 0; display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
  .btn-desa { padding:.6rem 1.4rem; border:0; border-radius:var(--radius-sm); cursor:pointer;
    background:#0f766e; color:#fff; font:inherit; font-size:.93rem; font-weight:600; }
  .btn-desa:hover { background:#0b5d56; } .btn-desa[disabled] { opacity:.5; cursor:default; }
  .estat { font-size:.85rem; color:var(--text-faint); }
  .estat.ok { color:#059669; } .estat.err { color:#dc2626; }
  .nav-veins { margin-left:auto; display:flex; gap:.5rem; align-items:center; font-size:.85rem; }
</style>
</head>
<body>
<main>
  <div class="container" style="padding-top:2.5rem;padding-bottom:2rem;max-width:900px">
    <div class="breadcrumb">
      <a href="/tutoria/">Tutoria 2n ESO E</a><span class="sep">/</span>
      <span class="current" id="bc">Fitxa</span>
    </div>
    <div id="cos" style="margin-top:1.5rem">
      <p style="color:var(--text-faint)">Carregant&hellip;</p>
    </div>
  </div>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const id = new URLSearchParams(location.search).get("id") || "";
const cos = document.getElementById("cos");
let ALUMNE = null;

const parseJSON = (s, def) => { try { return JSON.parse(s) || def; } catch (e) { return def; } };
const classeNota = n => n == null ? "n-cap" : n < 5 ? "n-sus" : n < 6 ? "n-just" : n < 8 ? "n-be" : "n-exc";

// ── Notas ───────────────────────────────────────────────────────
function taulaNotes(a) {
  const t = parseJSON(a.notes_anteriors, null);
  if (!Array.isArray(t) || !t.length) {
    return `<p class="ajut">Sense notes del curs anterior.${
      a.marca ? " És normal en un alumne repetidor: no estava en aquest nivell." : ""}</p>`;
  }
  const files = t.map(e => {
    const cel = k => {
      const n = e.t[k];
      return `<td class="n">${n == null
        ? '<span class="n-cap">&middot;</span>'
        : `<span class="${classeNota(n)}">${n}</span>`}</td>`;
    };
    return `<tr class="${e.clau === "mates" ? "destaca" : ""}">
      <td>${esc(e.nom)}</td>${cel("1")}${cel("2")}${cel("3")}${cel("0")}</tr>`;
  }).join("");

  const finals = t.map(e => e.t["0"] ?? e.t["3"]).filter(n => n != null);
  const mitj = finals.length ? (finals.reduce((x, y) => x + y, 0) / finals.length) : null;
  const susp = finals.filter(n => n < 5).length;

  return `<div class="notes-wrap"><table class="notes">
    <thead><tr><th>Matèria</th><th class="n">1a</th><th class="n">2a</th>
      <th class="n">3a</th><th class="n">Ord.</th></tr></thead>
    <tbody>${files}</tbody></table></div>
    <div class="graella" style="margin-top:1rem">
      <div><label style="font-size:.7rem;color:var(--text-soft)">Mitjana ordinària</label>
        <div style="font-family:var(--mono);font-size:1.3rem;font-weight:600"
             class="${classeNota(mitj)}">${mitj == null ? "—" : mitj.toFixed(2)}</div></div>
      <div><label style="font-size:.7rem;color:var(--text-soft)">Matèries suspeses</label>
        <div style="font-family:var(--mono);font-size:1.3rem;font-weight:600"
             class="${susp ? "n-sus" : "n-exc"}">${susp}</div></div>
      <div><label style="font-size:.7rem;color:var(--text-soft)">Pendents (centre)</label>
        <div style="font-family:var(--mono);font-size:1.3rem;font-weight:600">${a.pendents ?? "—"}</div></div>
      <div><label style="font-size:.7rem;color:var(--text-soft)">Grup del curs anterior</label>
        <div style="font-size:1.05rem;padding-top:.35rem">${esc(a.curs_anterior || "—")}</div></div>
    </div>`;
}

// Resumen corto del curso anterior, para leerlo de un vistazo al hacer
// el traspaso sin tener que ir a la tabla completa.
function resumNotes(a) {
  const t = parseJSON(a.notes_anteriors, null);
  if (!Array.isArray(t) || !t.length) {
    return `<p class="ajut">Sense notes del curs anterior.${
      a.marca ? " És normal en un alumne repetidor: no estava en aquest nivell." : ""}</p>`;
  }
  const finals = t.map(e => ({ nom: e.nom, n: e.t["0"] ?? e.t["3"] }))
                  .filter(x => x.n != null);
  const mitj = finals.length
    ? finals.reduce((s, x) => s + x.n, 0) / finals.length : null;
  const susp = finals.filter(x => x.n < 5);
  return `<div class="resum">
    <div class="resum-dada"><span class="et">Mitjana</span>
      <span class="vl ${classeNota(mitj)}">${mitj == null ? "—" : mitj.toFixed(2)}</span></div>
    <div class="resum-dada"><span class="et">Suspeses</span>
      <span class="vl ${susp.length ? "n-sus" : "n-exc"}">${susp.length}</span></div>
    <div class="resum-dada"><span class="et">Pendents</span>
      <span class="vl">${a.pendents ?? "—"}</span></div>
    <div class="resum-dada"><span class="et">Grup</span>
      <span class="vl" style="font-size:1.05rem">${esc(a.curs_anterior || "—")}</span></div>
    ${susp.length ? `<p class="suspeses">Va suspendre: ${
      susp.map(x => `<strong>${esc(x.nom)}</strong> (${x.n})`).join(", ")}.</p>` : ""}
  </div>`;
}

const casella = (k, et, ajuda, marcat) => `
  <label class="casella">
    <input type="checkbox" id="f-${k}" data-bandera="${k}"${marcat ? " checked" : ""}>
    <div><b>${et}</b><span>${ajuda}</span></div>
  </label>`;

// ── Listas dinámicas ────────────────────────────────────────────
const PLANTILLES = {
  familia: { titol: "Familiar", camps: [
    ["nom", "Nom i cognoms", "text"], ["relacio", "Relació", "text"],
    ["telefon", "Telèfon", "tel"], ["email", "Correu", "email"],
    ["notes", "Observacions", "area"]] },
  entrevistes: { titol: "Entrevista", camps: [
    ["data", "Data", "date"], ["amb", "Amb qui", "text"], ["resum", "Resum i acords", "area"]] },
  incidencies: { titol: "Incidència", camps: [
    ["data", "Data", "date"], ["tipus", "Tipus", "text"], ["descripcio", "Descripció", "area"]] },
};

function pintaLlista(clau) {
  const items = parseJSON(ALUMNE[clau], []) || [];
  const p = PLANTILLES[clau];
  const html = items.map((it, i) => `
    <div class="item" data-i="${i}">
      <div class="item-cap"><span>${p.titol} ${i + 1}</span>
        <button type="button" class="treu" data-llista="${clau}" data-i="${i}">Treure</button></div>
      <div class="graella">
        ${p.camps.map(([k, et, tipus]) => `
          <div class="camp ${tipus === "area" ? "ample" : ""}">
            <label>${et}</label>
            ${tipus === "area"
              ? `<textarea data-llista="${clau}" data-i="${i}" data-k="${k}"
                   style="min-height:70px">${esc(it[k] || "")}</textarea>`
              : `<input type="${tipus}" data-llista="${clau}" data-i="${i}" data-k="${k}"
                   value="${esc(it[k] || "")}">`}
          </div>`).join("")}
      </div>
    </div>`).join("");
  return html + `<button type="button" class="afegeix" data-afegeix="${clau}">
    + Afegir ${p.titol.toLowerCase()}</button>`;
}

const camp = (k, et, tipus, valor, ample) => `
  <div class="camp ${ample ? "ample" : ""}">
    <label for="f-${k}">${et}</label>
    ${tipus === "area"
      ? `<textarea id="f-${k}" data-camp="${k}">${esc(valor || "")}</textarea>`
      : `<input id="f-${k}" type="${tipus}" data-camp="${k}" value="${esc(valor || "")}">`}
  </div>`;

// ── Ficha ───────────────────────────────────────────────────────
function pinta(a, veins) {
  ALUMNE = a;
  document.title = `${a.nom} ${a.cognoms} — Tutoria`;
  document.getElementById("bc").textContent = `${a.nom} ${a.cognoms}`;

  const i = veins.findIndex(v => v.id === a.id);
  const ant = i > 0 ? veins[i - 1] : null, seg = i < veins.length - 1 ? veins[i + 1] : null;

  cos.innerHTML = `
  <div class="cap">
    <div>${a.foto
      ? `<img class="cap-foto" src="/tutoria/api/foto?id=${encodeURIComponent(a.id)}" alt="">`
      : `<div class="cap-foto cap-buit" aria-hidden="true">&#128100;</div>`}</div>
    <div>
      <span class="section-label">${esc(a.grup)} &middot; nº ${a.num} &middot; curs ${esc(a.curs)}</span>
      <h1 style="margin:.3rem 0 .1rem;font-size:1.6rem">${esc(a.nom)}</h1>
      <p style="margin:0;color:var(--text-soft);font-size:1.08rem">${esc(a.cognoms)}</p>
      <div class="chips">
        ${a.marca ? '<span class="chip chip-r">Repetidor</span>' : ""}
        ${a.pendents > 0 ? `<span class="chip chip-p">${a.pendents} pendents</span>` : ""}
        ${a.sexe ? `<span class="chip chip-n">${a.sexe === "H" ? "Noi" : "Noia"}</span>` : ""}
        ${a.curs_anterior ? `<span class="chip chip-n">${esc(a.curs_anterior)}</span>` : ""}
      </div>
    </div>
  </div>

  <div class="pestanyes" role="tablist">
    <button role="tab" data-sec="traspas" aria-selected="true">Traspàs${
      (a.derivacio && a.derivacio !== "cap") || a.pi_contingut || a.pi_metodologic || a.acollida
        ? '<span class="avis-punt" title="Té mesures"></span>' : ""}</button>
    <button role="tab" data-sec="academic" aria-selected="false">Acadèmic</button>
    <button role="tab" data-sec="familia" aria-selected="false">Família</button>
    <button role="tab" data-sec="seguiment" aria-selected="false">Seguiment</button>
    <button role="tab" data-sec="personal" aria-selected="false">Personal</button>
  </div>

  <section class="sec" data-sec="traspas">
    <h2>Traspàs del curs anterior</h2>
    <p class="ajut">Qui la va tenir, com va acabar el curs i tot el que et va explicar.
      És el primer que vols mirar al setembre.</p>
    ${resumNotes(a)}
    <div class="graella">
      ${camp("tutor_anterior", "Tutor/a del curs anterior", "text", a.tutor_anterior, true)}
      ${camp("traspas", "Què em va dir el tutor/a anterior", "area", a.traspas, true)}
    </div>

    <h3 style="font-size:.95rem;margin:1.8rem 0 .3rem">Mesures i suports</h3>
    <p class="ajut">Marca el que tingui reconegut. Val la pena tenir-ho clar abans de la
      primera avaluació.</p>
    <div class="graella">
      ${casella("pi_contingut", "PI de contingut",
        "Pla individualitzat amb objectius i continguts adaptats", a.pi_contingut)}
      ${casella("pi_metodologic", "PI metodològic",
        "Mateixos continguts, adaptacions en com s'avalua i es treballa", a.pi_metodologic)}
      ${casella("acollida", "Aula d'Acollida",
        "Suport lingüístic per a alumnat nouvingut", a.acollida)}
    </div>
    <div class="graella" style="margin-top:1rem">
      <div class="camp"><label for="f-derivacio">Derivació</label>
        <select id="f-derivacio" data-camp="derivacio">
          ${["", "Cap", "EAP", "CSMIJ", "Serveis Socials", "Extern privat", "Altres"]
            .map(v => `<option value="${esc(v)}"${(a.derivacio || "") === v ? " selected" : ""}>${
              v || "Sense dada"}</option>`).join("")}
        </select></div>
      ${camp("derivacio_nota", "Detall de la derivació", "text", a.derivacio_nota)}
      ${camp("suport", "Altres suports i reforços", "area", a.suport, true)}
    </div>
  </section>

  <section class="sec" data-sec="academic" hidden>
    <h2>Notes del curs anterior</h2>
    <p class="ajut">Les tres avaluacions i l'ordinària, tal com van sortir de la junta.
      Matemàtiques va destacada. No s'edita: ve dels butlletins del centre.</p>
    ${taulaNotes(a)}
  </section>

  <section class="sec" data-sec="familia" hidden>
    <h2>Família</h2>
    <p class="ajut">Qui atén les trucades i qui pot recollir-la.</p>
    <div id="l-familia">${pintaLlista("familia")}</div>
    <div class="graella" style="margin-top:1rem">
      ${camp("contacte", "Contacte ràpid", "text", a.contacte, true)}
      ${camp("recull", "Qui la pot recollir · autoritzacions", "area", a.recull, true)}
    </div>
  </section>

  <section class="sec" data-sec="seguiment" hidden>
    <h2>Seguiment</h2>
    <p class="ajut">Entrevistes, incidències i el que vagi passant durant el curs.</p>
    <h3 style="font-size:.95rem;margin:1.4rem 0 .6rem">Entrevistes</h3>
    <div id="l-entrevistes">${pintaLlista("entrevistes")}</div>
    <h3 style="font-size:.95rem;margin:1.8rem 0 .6rem">Incidències</h3>
    <div id="l-incidencies">${pintaLlista("incidencies")}</div>
    <div class="graella" style="margin-top:1.6rem">
      ${camp("acords", "Compromisos vigents", "area", a.acords, true)}
      ${camp("notes", "Observacions", "area", a.notes, true)}
    </div>
  </section>

  <section class="sec" data-sec="personal" hidden>
    <h2>Dades personals</h2>
    <div class="graella">
      ${camp("naixement", "Data de naixement", "date", a.naixement)}
      ${camp("idioma", "Llengua familiar", "text", a.idioma)}
      ${camp("telefon", "Telèfon de l'alumne", "tel", a.telefon)}
      ${camp("email", "Correu de l'alumne", "email", a.email)}
      ${camp("adreca", "Adreça", "text", a.adreca, true)}
      ${camp("extraescolars", "Extraescolars", "text", a.extraescolars)}
      ${camp("carrec", "Càrrec al grup", "text", a.carrec)}
      <div class="camp"><label for="f-imatge">Autorització d'imatge</label>
        <select id="f-imatge">
          <option value="">Sense dada</option>
          <option value="1"${a.imatge_ok === 1 ? " selected" : ""}>Sí</option>
          <option value="0"${a.imatge_ok === 0 ? " selected" : ""}>No</option>
        </select></div>
    </div>
  </section>

  <div class="peu">
    <button class="btn-desa" id="desa">Desar</button>
    <span class="estat" id="estat">${a.updated_at
      ? "Última edició: " + esc(String(a.updated_at).slice(0, 16).replace("T", " ")) : ""}</span>
    <span class="nav-veins">
      ${ant ? `<a href="?id=${encodeURIComponent(ant.id)}">&larr; ${esc(ant.nom)}</a>` : ""}
      ${seg ? `<a href="?id=${encodeURIComponent(seg.id)}">${esc(seg.nom)} &rarr;</a>` : ""}
    </span>
  </div>`;

  // La pestaña elegida se recuerda: al pasar de alumno con las flechas del
  // pie sigues en la misma, que es como se revisa un grupo entero.
  let sec = "traspas";
  try { sec = localStorage.getItem("tutoria:sec") || "traspas"; } catch (e) {}
  function mostra(quina) {
    if (!cos.querySelector(`section[data-sec="${quina}"]`)) quina = "traspas";
    sec = quina;
    try { localStorage.setItem("tutoria:sec", sec); } catch (e) {}
    cos.querySelectorAll("section[data-sec]").forEach(x => { x.hidden = x.dataset.sec !== sec; });
    cos.querySelectorAll('.pestanyes button').forEach(b =>
      b.setAttribute("aria-selected", String(b.dataset.sec === sec)));
  }
  mostra(sec);

  cos.addEventListener("click", e => {
    const pest = e.target.closest(".pestanyes button");
    if (pest) { mostra(pest.dataset.sec); return; }
    const add = e.target.closest("[data-afegeix]");
    if (add) {
      const clau = add.dataset.afegeix;
      const items = parseJSON(ALUMNE[clau], []) || [];
      items.push({});
      ALUMNE[clau] = JSON.stringify(items);
      document.getElementById("l-" + clau).innerHTML = pintaLlista(clau);
      return;
    }
    const treu = e.target.closest(".treu");
    if (treu) {
      const clau = treu.dataset.llista;
      const items = parseJSON(ALUMNE[clau], []) || [];
      items.splice(Number(treu.dataset.i), 1);
      ALUMNE[clau] = JSON.stringify(items);
      document.getElementById("l-" + clau).innerHTML = pintaLlista(clau);
    }
  });

  // Los campos de lista se reflejan en ALUMNE al escribir, para que
  // añadir o quitar un elemento no pierda lo tecleado en los demás.
  cos.addEventListener("input", e => {
    const el = e.target.closest("[data-llista]");
    if (!el) return;
    const clau = el.dataset.llista;
    const items = parseJSON(ALUMNE[clau], []) || [];
    (items[Number(el.dataset.i)] ||= {})[el.dataset.k] = el.value;
    ALUMNE[clau] = JSON.stringify(items);
  });

  document.getElementById("desa").addEventListener("click", desa);
}

async function desa() {
  const btn = document.getElementById("desa"), est = document.getElementById("estat");
  btn.disabled = true;
  est.className = "estat"; est.textContent = "Desant…";
  const dades = { id };
  document.querySelectorAll("[data-camp]").forEach(el => { dades[el.dataset.camp] = el.value; });
  for (const clau of Object.keys(PLANTILLES)) dades[clau] = parseJSON(ALUMNE[clau], []) || [];
  document.querySelectorAll("[data-bandera]").forEach(el => {
    dades[el.dataset.bandera] = el.checked;
  });
  const im = document.getElementById("f-imatge").value;
  dades.imatge_ok = im === "" ? null : im === "1";

  try {
    const r = await fetch("/tutoria/api/fitxa", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(dades),
    });
    if (!r.ok) {
      let detall = "";
      try { detall = (await r.json()).detall || ""; } catch (e) {}
      if (r.status === 401) throw new Error("Sessió caducada");
      // Falta la migració del traspàs: dir-ho, en lloc d'un "Error 500".
      throw new Error(/no such column/i.test(detall)
        ? "Falta migrar la base: executa scripts/sql/tutoria_traspas.sql"
        : detall || "Error " + r.status);
    }
    est.className = "estat ok"; est.textContent = "Desat";
  } catch (e) {
    est.className = "estat err"; est.textContent = e.message;
  } finally { btn.disabled = false; }
}

if (!id) {
  cos.innerHTML = '<p>Falta l\'identificador. <a href="/tutoria/">Torna a l\'orla</a>.</p>';
} else {
  fetch("/tutoria/api/fitxa?id=" + encodeURIComponent(id), { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => pinta(d.alumne, d.veins || []))
    .catch(err => {
      cos.innerHTML = err === 401
        ? '<p>La sessió ha caducat. <a href="/tutoria/">Torna a entrar</a>.</p>'
        : '<p>No s\'ha trobat l\'alumne. <a href="/tutoria/">Torna a l\'orla</a>.</p>';
    });
}
</script>
