<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Prova de normes · Tutoria</title>
<script>(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);else document.documentElement.setAttribute('data-theme','light');})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* Paleta de les gràfiques. Una sola sèrie a tot arreu, així que un sol to:
     no hi ha res que calgui distingir per color i la llegenda sobra. Validat
     amb l'script del skill de dataviz contra les dues superfícies. */
  .viz { --serie:#2a78d6; --serie-suau:rgba(42,120,214,.14); --reixa:var(--border); }
  [data-theme="dark"] .viz { --serie:#3987e5; --serie-suau:rgba(57,135,229,.2); }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem;
    flex-wrap:wrap; margin-bottom:1.5rem; }
  .btn { padding:.55rem 1.1rem; border:0; border-radius:var(--radius-sm); cursor:pointer;
    background:#0f766e; color:#fff; font:inherit; font-size:.9rem; font-weight:600;
    text-decoration:none; display:inline-block; }
  .btn:hover { background:#0b5d56; } .btn[disabled] { opacity:.5; cursor:default; }
  .btn-suau { background:var(--bg-subtle); color:var(--text); border:1px solid var(--border); }
  .btn-suau:hover { border-color:var(--text-faint); }
  .btn-perill { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
  [data-theme="dark"] .btn-perill { background:#2a1414; color:#fca5a5; border-color:#5c2626; }
  .buit { padding:2rem; text-align:center; color:var(--text-faint);
    border:1px dashed var(--border); border-radius:var(--radius); }
  .estat { font-size:.85rem; color:var(--text-faint); }
  .estat.err { color:#dc2626; }

  /* Sessions */
  .ses-card { display:flex; align-items:center; gap:1rem; padding:.95rem 1.1rem;
    border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-subtle);
    text-decoration:none; color:inherit; margin-bottom:.7rem; transition:border-color .15s; }
  .ses-card:hover { border-color:#0f766e; }
  .ses-codi { font-family:var(--mono); font-size:1.15rem; font-weight:600; letter-spacing:.12em;
    flex:none; }
  .ses-cos { flex:1; min-width:0; }
  .ses-cos h3 { margin:0 0 .15rem; font-size:.98rem; font-weight:600; }
  .ses-cos p { margin:0; font-size:.83rem; color:var(--text-soft); }
  .pin { font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; font-weight:600;
    padding:.15rem .5rem; border-radius:99px; flex:none; }
  .pin-on { color:#059669; background:rgba(5,150,105,.12); }
  .pin-off { color:var(--text-faint); background:var(--bg-hover); }

  /* Codi gran per a la pissarra */
  .pissarra { text-align:center; padding:1.6rem 1rem; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--bg-subtle); margin-bottom:1.5rem; }
  .pissarra .codi { font-family:var(--mono); font-size:3.2rem; font-weight:600;
    letter-spacing:.22em; line-height:1; }
  .pissarra .adr { font-size:.9rem; color:var(--text-soft); margin:.7rem 0 0; }
  .pissarra .adr b { font-family:var(--mono); font-weight:600; color:var(--text); }

  /* Fitxes de xifra */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(8rem,1fr)); gap:.8rem;
    margin-bottom:1.8rem; }
  .tile { border:1px solid var(--border); border-radius:var(--radius); padding:.9rem 1rem; }
  .tile dt { font-size:.7rem; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-faint); font-weight:600; margin:0 0 .35rem; }
  .tile dd { margin:0; font-family:var(--mono); font-size:1.6rem; font-weight:600; line-height:1; }
  .tile .peu { font-size:.75rem; color:var(--text-faint); margin:.3rem 0 0; font-family:var(--font); }

  /* Gràfiques */
  .graf { margin:0 0 2.2rem; }
  .graf h2 { font-size:1rem; margin:0 0 .2rem; }
  .graf .llegir { font-size:.83rem; color:var(--text-soft); margin:0 0 1rem; }

  /* Histograma vertical */
  .hist { display:flex; align-items:flex-end; gap:2px; height:170px;
    border-bottom:1px solid var(--reixa); padding-bottom:0; }
  .hist-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; height:100%; gap:.3rem; }
  .hist-n { font-family:var(--mono); font-size:.75rem; color:var(--text-soft); }
  .hist-b { display:block; width:100%; background:var(--serie); border-radius:4px 4px 0 0;
    min-height:2px; transition:filter .12s; }
  .hist-col:hover .hist-b { filter:brightness(1.15); }
  .hist-col.zero .hist-b { background:var(--serie-suau); }
  .hist-eix { display:flex; gap:2px; margin-top:.35rem; }
  .hist-eix span { flex:1; text-align:center; font-family:var(--mono); font-size:.68rem;
    color:var(--text-faint); }
  .tall { position:relative; }
  .tall::after { content:""; position:absolute; left:-1px; top:0; bottom:0; width:1px;
    background:var(--text-faint); opacity:.5; }

  /* Barres horitzontals */
  .files { display:flex; flex-direction:column; gap:2px; }
  .fila { display:grid; grid-template-columns:minmax(0,18rem) 1fr 3.2rem; align-items:center;
    gap:.7rem; padding:.35rem .4rem; border-radius:4px; }
  .fila:hover { background:var(--bg-subtle); }
  .fila-et { font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fila-pista { display:block; height:14px; border-radius:4px; background:var(--bg-hover); overflow:hidden; }
  /* display:block explícit: és un <span> dins d'un altre <span>, i un element
     en línia ignora width i height. Sense això la barra no es veia. */
  .fila-fill { display:block; height:100%; background:var(--serie); border-radius:4px; min-width:2px; }
  .fila-val { font-family:var(--mono); font-size:.82rem; text-align:right;
    font-variant-numeric:tabular-nums; }
  .fila-cap { display:grid; grid-template-columns:minmax(0,18rem) 1fr 3.2rem; gap:.7rem;
    padding:0 .4rem .3rem; font-size:.68rem; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-faint); font-weight:600; }
  .fila-cap span:last-child { text-align:right; }
  @media (max-width:640px) {
    .fila, .fila-cap { grid-template-columns:minmax(0,9rem) 1fr 3rem; gap:.5rem; }
    .fila-et { font-size:.78rem; }
  }
  .fila.fluix .fila-et { font-weight:600; }
  .marca-mig { font-size:.75rem; color:var(--text-faint); margin:.6rem 0 0; }

  /* Taula d'alumnes */
  table.alu { border-collapse:collapse; width:100%; font-size:.9rem; }
  table.alu th { text-align:left; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-faint); font-weight:600; padding:.55rem .6rem; background:var(--bg-subtle);
    border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap; }
  table.alu th:hover { color:var(--text); }
  table.alu td { padding:.45rem .6rem; border-bottom:1px solid var(--border); }
  table.alu tr:last-child td { border-bottom:none; }
  table.alu .n { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .susp { color:#b91c1c; font-weight:600; }
  [data-theme="dark"] .susp { color:#fca5a5; }
  .repe { font-size:.7rem; color:#b45309; background:rgba(180,83,9,.12); padding:.1rem .35rem;
    border-radius:4px; margin-left:.4rem; }
  .taula-embolcall { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
  /* Amb 125 alumnes la pàgina passava dels 8.000 px i les gràfiques quedaven
     perdudes a dalt. La taula es queda amb el seu propi scroll. */
  .taula-alta { max-height:32rem; overflow-y:auto; }
  .taula-alta table.alu thead th { position:sticky; top:0; z-index:1; }

  /* Tooltip */
  #tt { position:fixed; z-index:60; pointer-events:none; opacity:0; transition:opacity .1s;
    background:var(--text); color:var(--bg); font-size:.8rem; line-height:1.35;
    padding:.45rem .6rem; border-radius:6px; max-width:20rem; box-shadow:0 6px 20px rgba(0,0,0,.18); }
  #tt.on { opacity:1; }
  details.dades { margin-top:.8rem; }
  details.dades summary { font-size:.8rem; color:var(--text-soft); cursor:pointer; }
  details.dades table { margin-top:.6rem; }
</style>
</head>
<body class="viz">
<div id="tt" role="status" aria-live="polite"></div>
<main>
  <div class="container" style="padding-top:2.5rem;padding-bottom:3rem;max-width:900px">
    <div class="breadcrumb">
      <a href="/tutoria/">Tutoria 2n ESO E</a><span class="sep">/</span>
      <span class="current" id="bc">Prova de normes</span>
    </div>
    <div id="cos" style="margin-top:1.5rem">
      <p style="color:var(--text-faint)">Carregant&hellip;</p>
    </div>
  </div>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const cos = document.getElementById("cos");
const tt = document.getElementById("tt");
const nf = n => (Math.round(n * 100) / 100).toString().replace(".", ",");
let PREGUNTES = {}, ORDENA = { camp: "nom", asc: true }, DADES = null;

const api = async (url, opcions) => {
  const r = await fetch(url, { cache: "no-store", ...opcions });
  if (!r.ok) {
    let detall = "";
    try { detall = (await r.json()).detall || ""; } catch (e) {}
    throw Object.assign(new Error(detall || "Error " + r.status), { status: r.status });
  }
  return r.json();
};

// ── Tooltip compartit ───────────────────────────────────────────
// Una gràfica HTML és interactiva per definició: cada barra diu què és en
// passar-hi per sobre, i així no cal etiquetar-ho tot alhora.
document.addEventListener("mouseover", ev => {
  const el = ev.target.closest("[data-tt]");
  if (!el) return;
  tt.innerHTML = el.dataset.tt;
  tt.classList.add("on");
});
document.addEventListener("mousemove", ev => {
  if (!tt.classList.contains("on")) return;
  const m = 14, w = tt.offsetWidth, h = tt.offsetHeight;
  tt.style.left = Math.min(ev.clientX + m, innerWidth - w - 8) + "px";
  tt.style.top = (ev.clientY - h - m < 8 ? ev.clientY + m : ev.clientY - h - m) + "px";
});
document.addEventListener("mouseout", ev => {
  if (ev.target.closest("[data-tt]")) tt.classList.remove("on");
});

// ── Índex de sessions ───────────────────────────────────────────
async function pintaIndex() {
  document.getElementById("bc").textContent = "Prova de normes";
  const { sessions, total } = await api("/tutoria/api/normes");
  cos.innerHTML = `
    <div class="top">
      <div><h1 style="margin:0 0 .2rem;font-size:1.5rem">Prova de normes de convivència</h1>
        <p style="margin:0;color:var(--text-soft);font-size:.93rem">${total} preguntes.
          Obre una sessió, escriu el codi a la pissarra i els alumnes entren a
          <b style="font-family:var(--mono)">alexreyes.es/docencia/tutoria-2eso/normes/</b></p></div>
    </div>
    ${sessions.length ? sessions.map(s => `
      <a class="ses-card" href="?codi=${encodeURIComponent(s.codi)}">
        <span class="ses-codi">${esc(s.codi)}</span>
        <span class="ses-cos"><h3>${esc(s.nom)}</h3>
          <p>${s.entregues} ${s.entregues === 1 ? "entrega" : "entregues"} ·
             ${esc((s.creada || "").slice(0, 10))}</p></span>
        <span class="pin ${s.oberta ? "pin-on" : "pin-off"}">${s.oberta ? "Oberta" : "Tancada"}</span>
      </a>`).join("")
      : '<p class="buit">Encara no has passat la prova. Crea la primera sessió aquí sota.</p>'}
    <div style="margin-top:1.5rem;border:1px dashed var(--border);border-radius:var(--radius);padding:1rem 1.1rem">
      <label for="nova-nom" style="display:block;font-size:.8rem;font-weight:600;color:var(--text-soft);margin-bottom:.4rem">Nom de la sessió</label>
      <input id="nova-nom" placeholder="Normes de convivència · setembre"
        style="width:100%;padding:.55rem .7rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font:inherit;font-size:.93rem;margin-bottom:.6rem">
      <button class="btn" id="nova-btn">Crear sessió i obtenir codi</button>
      <span class="estat" id="nova-estat"></span>
    </div>`;

  document.getElementById("nova-btn").addEventListener("click", async ev => {
    const nom = document.getElementById("nova-nom").value.trim();
    const estat = document.getElementById("nova-estat");
    ev.target.disabled = true; estat.className = "estat"; estat.textContent = "Creant…";
    try {
      const d = await api("/tutoria/api/normes", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ nom: nom || "Prova de normes" }),
      });
      location.search = "?codi=" + encodeURIComponent(d.codi);
    } catch (e) {
      estat.className = "estat err"; estat.textContent = e.message;
      ev.target.disabled = false;
    }
  });
}

// ── Detall d'una sessió ─────────────────────────────────────────
async function pintaSessio(codi) {
  const [d, banc] = await Promise.all([
    api("/tutoria/api/normes?codi=" + encodeURIComponent(codi)),
    fetch("/assets/data/normes-preguntes.json", { cache: "no-cache" })
      .then(r => r.ok ? r.json() : { preguntes: [] }).catch(() => ({ preguntes: [] })),
  ]);
  DADES = d;
  (banc.preguntes || []).forEach(p => { PREGUNTES[p.id] = p; });
  document.getElementById("bc").textContent = d.sessio.nom;

  const r = d.resum;
  const pctAprov = r.entregues ? Math.round(100 * r.aprovats / r.entregues) : 0;

  cos.innerHTML = `
    <div class="top">
      <div><h1 style="margin:0 0 .2rem;font-size:1.5rem">${esc(d.sessio.nom)}</h1>
        <p style="margin:0;color:var(--text-soft);font-size:.93rem">
          ${d.total} preguntes · versió ${esc(d.versio)}</p></div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn ${d.sessio.oberta ? "btn-perill" : ""}" id="btn-obre">
          ${d.sessio.oberta ? "Tancar la prova" : "Tornar a obrir"}</button>
        <button class="btn btn-suau" id="btn-corr">
          ${d.sessio.correccio ? "Amagar la correcció" : "Ensenyar la correcció"}</button>
        <a class="btn btn-suau" href="/tutoria/api/normes?codi=${encodeURIComponent(codi)}&csv=1">CSV</a>
        <a class="btn btn-suau" href="/tutoria/normes/">Totes</a>
      </div>
    </div>

    ${d.sessio.oberta ? `
    <div class="pissarra">
      <div class="codi">${esc(d.sessio.codi)}</div>
      <p class="adr">alexreyes.es/docencia/tutoria-2eso/normes/</p>
    </div>` : ""}
    <p class="estat" style="margin:-.8rem 0 1.5rem">
      ${d.sessio.correccio
        ? "En acabar, l'alumne veu quines ha fallat i la norma que ho justifica."
        : "En acabar, l'alumne només veu la nota. Obre la correcció quan hagi acabat tothom."}</p>

    <dl class="tiles">
      <div class="tile"><dt>Entregues</dt><dd>${r.entregues}</dd></div>
      <div class="tile"><dt>Nota mitjana</dt><dd>${nf(r.mitjana)}</dd>
        <p class="peu">mediana ${nf(r.mediana)}</p></div>
      <div class="tile"><dt>Aproven</dt><dd>${pctAprov}%</dd>
        <p class="peu">${r.aprovats} de ${r.entregues}</p></div>
      <div class="tile"><dt>Marge</dt><dd style="font-size:1.15rem">${nf(r.minima)} – ${nf(r.maxima)}</dd></div>
    </dl>

    ${r.entregues === 0
      ? '<p class="buit">Encara no ha contestat ningú. El codi és a dalt.</p>'
      : grafHistograma(d) + grafPreguntes(d) + grafGrups(d) + taulaAlumnes(d)}`;

  document.getElementById("btn-obre").addEventListener("click", async ev => {
    const accio = d.sessio.oberta ? "tanca" : "obre";
    ev.target.disabled = true;
    try {
      await api(`/tutoria/api/normes?${accio}=${encodeURIComponent(codi)}`, { method: "POST" });
      location.reload();
    } catch (e) { alert(e.message); ev.target.disabled = false; }
  });
  document.getElementById("btn-corr").addEventListener("click", async ev => {
    ev.target.disabled = true;
    try {
      await api(`/tutoria/api/normes?correccio=${encodeURIComponent(codi)}:${d.sessio.correccio ? 0 : 1}`,
        { method: "POST" });
      location.reload();
    } catch (e) { alert(e.message); ev.target.disabled = false; }
  });
  document.querySelectorAll("table.alu th[data-camp]").forEach(th => {
    th.addEventListener("click", () => {
      const c = th.dataset.camp;
      ORDENA = { camp: c, asc: ORDENA.camp === c ? !ORDENA.asc : c === "nom" };
      document.getElementById("alu-cos").innerHTML = filesAlumnes(DADES);
    });
  });
}

// ── Gràfica 1 · Distribució de notes ────────────────────────────
function grafHistograma(d) {
  const h = d.histograma, max = Math.max(...h, 1);
  const cols = h.map((n, i) => {
    const rang = i === 9 ? "9–10" : `${i}–${i + 1}`;
    return `<div class="hist-col ${n ? "" : "zero"} ${i === 5 ? "tall" : ""}"
              data-tt="<b>${n} ${n === 1 ? "alumne" : "alumnes"}</b> amb nota ${rang}">
              <span class="hist-n">${n || ""}</span>
              <span class="hist-b" style="height:${Math.max(2, 100 * n / max)}%"></span>
            </div>`;
  }).join("");
  return `<section class="graf">
    <h2>Distribució de les notes</h2>
    <p class="llegir">Quants alumnes cauen a cada franja d'un punt. La línia marca el 5.</p>
    <div class="hist">${cols}</div>
    <div class="hist-eix">${h.map((_, i) => `<span>${i}</span>`).join("")}</div>
  </section>`;
}

// ── Gràfica 2 · Encert per pregunta ─────────────────────────────
// Una situació es reconeix pel cas ("Sona el timbre de canvi de classe…"),
// no per la pregunta, que sovint és un "És correcte, això?" idèntic a
// mitja dotzena més. Per al test, l'enunciat ja identifica.
function etiqueta(q, id) {
  if (!q.q) return id;
  return q.tipus === "situacio" ? q.q : q.q;
}
function grafPreguntes(d) {
  // De pitjor a millor: el que interessa és quines normes no han quedat
  // clares, i aquestes són les primeres que s'han de veure.
  const files = d.perPregunta.slice()
    .filter(p => p.pct !== null)
    .sort((a, b) => a.pct - b.pct)
    .map(p => {
      const q = PREGUNTES[p.id] || {};
      const et = etiqueta(q, p.id);
      const ple = q.tipus === "situacio"
        ? `<i>${esc(q.q || "")}</i><br><b>${esc(q.pregunta || "")}</b>`
        : `<b>${esc(q.q || p.id)}</b>`;
      return `<div class="fila ${p.pct < 50 ? "fluix" : ""}"
                data-tt="${ple}<br>${p.encerts} de ${p.respostes} · ${esc(q.bloc || "")}">
        <span class="fila-et">${esc(et)}</span>
        <span class="fila-pista"><span class="fila-fill" style="width:${p.pct}%"></span></span>
        <span class="fila-val">${p.pct}%</span></div>`;
    }).join("");
  const taula = d.perPregunta.map(p => {
    const q = PREGUNTES[p.id] || {};
    return `<tr><td>${esc(etiqueta(q, p.id))}</td>
      <td class="n">${p.encerts}/${p.respostes}</td><td class="n">${p.pct === null ? "—" : p.pct + "%"}</td></tr>`;
  }).join("");
  return `<section class="graf">
    <h2>Encert per pregunta</h2>
    <p class="llegir">Ordenat de la pitjor a la millor. Les de sota del 50% són les normes
      que caldria repassar a classe.</p>
    <div class="fila-cap"><span>Pregunta</span><span>Encert</span></div>
    <div class="files">${files}</div>
    <details class="dades"><summary>Veure-ho com a taula</summary>
      <div class="taula-embolcall"><table class="alu">
        <thead><tr><th>Pregunta</th><th>Encerts</th><th>%</th></tr></thead>
        <tbody>${taula}</tbody></table></div></details>
  </section>`;
}

// ── Gràfica 3 · Per grup ────────────────────────────────────────
function grafGrups(d) {
  if (d.perGrup.length < 2) return "";
  const files = d.perGrup.map(g => `
    <div class="fila" data-tt="<b>${esc(g.grup)}</b><br>${g.n} ${g.n === 1 ? "entrega" : "entregues"} ·
        ${g.aprovats} aproven">
      <span class="fila-et">${esc(g.grup)}</span>
      <span class="fila-pista"><span class="fila-fill" style="width:${10 * g.mitjana}%"></span></span>
      <span class="fila-val">${nf(g.mitjana)}</span></div>`).join("");
  return `<section class="graf">
    <h2>Nota mitjana per grup</h2>
    <p class="llegir">Sobre 10. La barra plena seria un 10.</p>
    <div class="fila-cap"><span>Grup</span><span>Mitjana</span></div>
    <div class="files">${files}</div>
  </section>`;
}

// ── Taula d'alumnes ─────────────────────────────────────────────
function filesAlumnes(d) {
  const { camp, asc } = ORDENA;
  const files = d.alumnes.slice().sort((a, b) => {
    const x = a[camp], y = b[camp];
    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "ca");
    return asc ? c : -c;
  });
  return files.map(a => `<tr>
    <td>${esc(a.nom)}${a.intents > 1 ? `<span class="repe">${a.intents} intents</span>` : ""}</td>
    <td>${esc(a.grup)}</td>
    <td class="n">${a.encerts}/${a.total}</td>
    <td class="n ${a.nota < 5 ? "susp" : ""}">${nf(a.nota)}</td>
    <td class="n" style="color:var(--text-faint)">${esc((a.enviada || "").slice(11, 16))}</td>
  </tr>`).join("");
}

function taulaAlumnes(d) {
  return `<section class="graf">
    <h2>Alumnes</h2>
    <p class="llegir">Compta el primer intent. Clica una columna per ordenar.</p>
    <div class="taula-embolcall taula-alta"><table class="alu">
      <thead><tr>
        <th data-camp="nom">Alumne</th><th data-camp="grup">Grup</th>
        <th data-camp="encerts" class="n">Encerts</th><th data-camp="nota" class="n">Nota</th>
        <th data-camp="enviada" class="n">Hora</th>
      </tr></thead>
      <tbody id="alu-cos">${filesAlumnes(d)}</tbody>
    </table></div>
  </section>`;
}

// ── Arrencada ───────────────────────────────────────────────────
(async () => {
  const codi = new URLSearchParams(location.search).get("codi");
  try {
    await (codi ? pintaSessio(codi.toUpperCase()) : pintaIndex());
  } catch (e) {
    if (e.status === 401) {
      cos.innerHTML = '<p class="buit">La sessió ha caducat. <a href="/tutoria/">Torna a entrar</a>.</p>';
      return;
    }
    const falta = /no such table/i.test(e.message);
    cos.innerHTML = `<p class="buit">No s'han pogut llegir les dades.<br>
      <small>${esc(e.message)}</small>${falta ? `<br><br><small>Falta crear les taules:
      <code>npx wrangler d1 execute tutoria --remote --file=scripts/sql/normes_schema.sql</code></small>` : ""}</p>`;
    console.error(e);
  }
})();
</script>
