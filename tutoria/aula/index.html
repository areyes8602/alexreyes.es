<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Distribució de l'aula · Tutoria</title>
<script>(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);else document.documentElement.setAttribute('data-theme','light');})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  .barra { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem; }
  .barra select, .barra input[type=text] { padding:.45rem .6rem; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--bg); color:var(--text);
    font:inherit; font-size:.9rem; }
  .btn { padding:.5rem 1rem; border:0; border-radius:var(--radius-sm); cursor:pointer;
    background:#0f766e; color:#fff; font:inherit; font-size:.88rem; font-weight:600; }
  .btn:hover { background:#0b5d56; } .btn[disabled] { opacity:.5; cursor:default; }
  .btn-suau { background:var(--bg-subtle); color:var(--text); border:1px solid var(--border); }
  .btn-suau:hover { background:var(--bg-subtle); border-color:var(--text-faint); }
  .grup-b { display:flex; align-items:center; gap:.4rem; font-size:.88rem;
    color:var(--text-soft); }
  .marca-op { display:flex; align-items:center; gap:.4rem; font-size:.88rem; cursor:pointer; }
  .marca-op input { width:1.05rem; height:1.05rem; accent-color:#0f766e; }
  .estat { font-size:.85rem; color:var(--text-faint); }
  .estat.ok { color:#059669; } .estat.err { color:#dc2626; }

  /* ── Plànol ── */
  .plan-wrap { border:1px solid var(--border); border-radius:var(--radius); background:#fff;
    padding:1.2rem; overflow-x:auto; }
  /* En pantalla estreta el plànol no s'encongeix: amb sis files de cinc les
     targetes quedarien una sobre l'altra. Millor que llisqui de costat. */

  /* Plànol de l'aula de 2n ESO E: pissarra i taula del professor a dalt,
     finestres a l'esquerra i porta a baix a l'esquerra. */
  .aula { --mur:1.5rem; min-width:600px; }
  .mur-dalt { display:flex; gap:3px; margin-left:var(--mur); }
  .taula-prof, .pissarra { font-size:.66rem; letter-spacing:.1em; text-transform:uppercase;
    color:#444; text-align:center; padding:.4rem .3rem; border:1px solid #bbb;
    border-radius:3px 3px 0 0; border-bottom:0; }
  .taula-prof { flex:0 0 26%; background:#dfe7e6; font-weight:700; }
  .pissarra { flex:1; background:#3f4a48; color:#e8efed; border-color:#3f4a48; }
  .cos { display:flex; }
  .mur-esq { flex:0 0 var(--mur); border:1px solid #bbb; border-right:0;
    border-radius:3px 0 0 3px; display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(0deg,#dbeafe 0 14px,#bfdbfe 14px 16px); }
  .mur-esq span { font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
    color:#1e40af; writing-mode:vertical-rl; transform:rotate(180deg); }
  .mur-baix { display:flex; margin-left:var(--mur); }
  .porta { flex:0 0 22%; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    color:#7c2d12; text-align:center; padding:.3rem; background:#fed7aa;
    border:1px solid #bbb; border-top:0; border-radius:0 0 3px 3px; }
  .mur-baix .resta { flex:1; border-top:1px solid #bbb; }

  .plan { position:relative; flex:1; aspect-ratio:4/5; background:
    repeating-linear-gradient(0deg,#fafafa 0 24px,#f2f2f2 24px 25px),
    repeating-linear-gradient(90deg,#fafafa 0 24px,#f2f2f2 24px 25px);
    border:1px solid #bbb; overflow:hidden; touch-action:none; }
  /* Amplada en % del plànol perquè hi càpiguen 5 pupitres per fila sigui
     quina sigui la mida de la pantalla. */
  /* Targeta horitzontal: la foto petita al costat del nom. Amb la foto a
     sobre, la targeta era massa alta perquè hi cabessin sis files, i
     encongir-la de dalt a baix desfigurava les cares. */
  .seient { position:absolute; transform:translate(-50%,-50%); cursor:grab;
    background:#fff; border:1px solid #999; border-radius:5px; padding:.18rem .26rem;
    user-select:none; width:var(--fitxa,16%); min-width:66px;
    display:flex; align-items:center; gap:.25rem; text-align:left;
    box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .seient.arrossegant { cursor:grabbing; box-shadow:0 6px 16px rgba(0,0,0,.25); z-index:10; }
  /* Miniatura amb la proporció de la foto original: no es deforma, només
     es fa petita. */
  .seient img { flex:none; width:22px; aspect-ratio:127/192; object-fit:cover;
    display:block; border-radius:2px; background:#eee; }
  .seient .txt { min-width:0; }
  .seient .nom { font-size:.65rem; line-height:1.15; color:#111; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seient .cog { font-size:.58rem; line-height:1.15; color:#555;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plan.sense-fotos .seient { width:calc(var(--fitxa,16%) - 3%); min-width:56px; }
  .plan.sense-fotos .seient img { display:none; }

  /* Foto gran: la targeta és la fotografia i el nom va en una franja a
     sobre. Per al full que es queda a la taula el que compta és reconèixer
     la cara des de mig metre, no llegir el cognom sencer, i posant el nom
     al damunt la cara es fa un terç més gran. */
  .plan.foto-gran .seient { display:block; padding:0; overflow:hidden; border-radius:4px; }
  .plan.foto-gran .seient img { width:100%; height:auto; border-radius:0; }
  .plan.foto-gran .seient .txt { position:absolute; left:0; right:0; bottom:0;
    text-align:center; padding:.08rem .1rem; background:rgba(255,255,255,.92);
    border-top:1px solid rgba(0,0,0,.14);
    print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  .plan.foto-gran .seient .nom { font-size:.7rem; }
  .plan.foto-gran .seient .cog { font-size:.6rem; }
  /* Qui no té fotografia es queda amb el nom centrat al requadre, perquè
     el seu lloc a l'aula es vegi igual. */
  .plan.foto-gran .seient.sense-foto { aspect-ratio:127/192; background:#f0f0f0;
    display:flex; align-items:center; print-color-adjust:exact; }
  .plan.foto-gran .seient.sense-foto img { display:none; }
  .plan.foto-gran .seient.sense-foto .txt { position:static; width:100%;
    background:none; border:0; }

  /* Vista des de la taula del professor: mira la classe des de l'altre
     costat, o sigui que qui té a la seva esquerra li surt a la dreta del
     plànol. Es gira l'aula mitja volta i es redrecen els rètols i les
     targetes: el paper li queda com el que veu aixecant el cap. El retolet
     de les finestres, en vertical, queda llegible sense tocar-lo. */
  .aula.vista-prof { transform:rotate(180deg); }
  .aula.vista-prof .taula-prof,
  .aula.vista-prof .pissarra,
  .aula.vista-prof .porta { transform:rotate(180deg); }
  .aula.vista-prof .seient { transform:translate(-50%,-50%) rotate(180deg); }

  /* Els pupitres. Es dibuixen fluixos perquè, arrossegant, vegis on pots
     deixar algú i quins llocs queden buits. Al paper no hi surten: allà
     només compta qui seu on. L'alçada és la de la targeta de cada estil,
     mesurada, perquè el requadre i qui l'ocupa coincideixin. */
  .lloc { position:absolute; transform:translate(-50%,-50%); pointer-events:none;
    width:var(--fitxa,16%); min-width:66px; height:2.56rem;
    border:1px dashed #cfcfcf; border-radius:5px; }
  .plan.sense-fotos .lloc { width:calc(var(--fitxa,16%) - 3%); min-width:56px;
    height:1.9rem; }
  .plan.foto-gran .lloc { height:auto; aspect-ratio:127/192; }
  .lloc.diana { border:1px solid #0f766e; background:rgba(15,118,110,.1); }

  .banqueta { border:1px dashed var(--border); border-radius:var(--radius);
    padding:.8rem; margin-top:1rem; }
  .banqueta h3 { margin:0 0 .5rem; font-size:.8rem; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-soft); }
  .banqueta .fitxes { display:flex; gap:.4rem; flex-wrap:wrap; }
  .banqueta .seient { position:static; transform:none; width:auto; min-width:0; }
  .ajut { font-size:.85rem; color:var(--text-faint); }

  @page { size:A4 portrait; margin:10mm; }
  @media print {
    nav, .breadcrumb, .barra, .banqueta, .no-print, .lloc { display:none !important; }
    .plan-wrap { border:0; padding:0; overflow:visible; }
    .container { max-width:none; padding:0 !important; }
    .aula { min-width:0; }
    /* El plànol conserva la proporció de la pantalla (4:5, l'aula és més
       fonda que ampla). Abans se li fixava l'alçada en centímetres i al
       paper sortia més ample que alt: les files s'arrapaven quasi un terç
       respecte de les columnes i el full no s'assemblava al que veies.
       Deixant-ho a la proporció, l'alçada la mana l'amplada del foli i
       imprimeixes exactament el que tens a la pantalla. */
    /* La pissarra, les finestres i la porta són la referència per situar-se
       al full: han de sortir impreses encara que el navegador tregui els
       fons per estalviar tinta. */
    .taula-prof, .pissarra, .mur-esq, .porta, .seient img {
      print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  }
</style>
</head>
<body>
<main>
  <div class="container" style="padding-top:2.5rem;padding-bottom:3rem;max-width:1000px">
    <div class="breadcrumb">
      <a href="/tutoria/">Tutoria 2n ESO E</a><span class="sep">/</span>
      <span class="current">Distribució de l'aula</span>
    </div>

    <div class="barra no-print" style="margin-top:1.5rem">
      <select id="quina"></select>
      <input id="nom-nova" type="text" placeholder="Nom d'una distribució nova">
      <button class="btn btn-suau" id="crea">Crear</button>
      <label class="marca-op"><input type="checkbox" id="fotos" checked> Amb fotos</label>
      <select id="mida" title="Mida i estil de les targetes">
        <option value="13">Targetes petites</option>
        <option value="16" selected>Mitjanes</option>
        <option value="18">Grans</option>
        <option value="foto">Amb foto gran</option>
      </select>
      <label class="marca-op" title="Com ho veus des de la teva taula, mirant la classe">
        <input type="checkbox" id="vista-prof"> Vista des de la taula</label>
      <span class="grup-b">Col·locar:
        <button class="btn btn-suau" id="ordena">En files</button>
        <button class="btn btn-suau" id="ordena-col">En columnes</button>
      </span>
      <button class="btn" id="desa">Desar</button>
      <button class="btn btn-suau" id="imprimir">Imprimir</button>
      <span class="estat" id="estat"></span>
    </div>

    <div class="plan-wrap">
      <div class="aula">
        <div class="mur-dalt">
          <div class="taula-prof">Taula prof.</div>
          <div class="pissarra">Pissarra</div>
        </div>
        <div class="cos">
          <div class="mur-esq"><span>Finestres</span></div>
          <div class="plan" id="plan"></div>
        </div>
        <div class="mur-baix">
          <div class="porta">Porta</div>
          <div class="resta"></div>
        </div>
      </div>
    </div>

    <div class="banqueta no-print">
      <h3>Sense lloc assignat</h3>
      <div class="fitxes" id="banqueta"></div>
      <p class="ajut" style="margin:.6rem 0 0">Arrossega'ls al plànol. Per treure'n un,
        torna'l a arrossegar aquí sota.</p>
    </div>
  </div>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const GRUP = "2ESO-E", CURS = "2026-27";
const plan = document.getElementById("plan");
const banqueta = document.getElementById("banqueta");
const estat = document.getElementById("estat");
let ALUMNES = [], POS = {}, AULA = null;

// ── Els llocs de l'aula ─────────────────────────────────────────
// Sis files de cinc: la capacitat. Els pupitres són fixos i sempre els
// mateixos, tant si col·loques amb els botons com si arrossegues a mà. Així
// el plànol no acaba tort per haver deixat una targeta dos píxels més avall,
// i imprès es llegeix de cop.
const PER_FILA = 5, FILES = 6;
const lloc = (col, fila) => ({ x: 11 + col * 19.5, y: 10 + fila * 15 });
const LLOCS = [];
for (let f = 0; f < FILES; f++)
  for (let c = 0; c < PER_FILA; c++) LLOCS.push(lloc(c, f));
const clau = p => Math.round(p.x) + ":" + Math.round(p.y);

// Qui seu en aquest pupitre, si hi ha algú, sense comptar-hi `tret`.
const ocupant = (l, tret) =>
  Object.keys(POS).find(i => i !== tret && clau(POS[i]) === clau(l));

// El pupitre més proper al punt on s'ha deixat anar la targeta. Amb
// `lliures`, només es miren els que no té ningú; si no en queda cap, torna
// null i qui crida decideix.
function llocProper(x, y, lliures, tret) {
  let millor = null, d = Infinity;
  for (const l of LLOCS) {
    if (lliures && ocupant(l, tret)) continue;
    const dd = (l.x - x) ** 2 + (l.y - y) ** 2;
    if (dd < d) { d = dd; millor = l; }
  }
  return millor;
}

const api = async (url, o) => {
  const r = await fetch(url, { cache: "no-store", ...o });
  if (!r.ok) {
    let d = ""; try { d = (await r.json()).detall || ""; } catch (e) {}
    throw Object.assign(new Error(d || "Error " + r.status), { status: r.status });
  }
  return r.json();
};

function fitxa(a) {
  const el = document.createElement("div");
  el.className = a.foto ? "seient" : "seient sense-foto";
  el.dataset.id = a.id;
  el.innerHTML = `${a.foto
      ? `<img src="/tutoria/api/foto?id=${encodeURIComponent(a.id)}" alt="" draggable="false">`
      : `<img alt="" draggable="false">`}
    <div class="txt">
      <div class="nom">${esc(a.nom.split(" ")[0])}</div>
      <div class="cog">${esc(a.cognoms.split(" ")[0])}</div>
    </div>`;
  return el;
}

let DIANES = [];
function pintaLlocs() {
  DIANES = LLOCS.map(l => {
    const d = document.createElement("div");
    d.className = "lloc";
    d.style.left = l.x + "%"; d.style.top = l.y + "%";
    plan.appendChild(d);
    return d;
  });
}
// Il·lumina el pupitre on cauria la targeta que s'està arrossegant.
function marcaDiana(l) {
  DIANES.forEach((d, i) =>
    d.classList.toggle("diana", !!l && clau(LLOCS[i]) === clau(l)));
}

function pinta() {
  plan.innerHTML = ""; banqueta.innerHTML = "";
  pintaLlocs();
  aplicaEstil();
  for (const a of ALUMNES) {
    const el = fitxa(a);
    const p = POS[a.id];
    if (p) {
      el.style.left = p.x + "%"; el.style.top = p.y + "%";
      plan.appendChild(el);
    } else {
      banqueta.appendChild(el);
    }
  }
}

// ── Arrossegar ──────────────────────────────────────────────────
// Amb Pointer Events: funciona igual amb ratolí i amb dit, i no cal el
// drag-and-drop d'HTML5, que a tauleta no va.
let mou = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".seient");
  if (!el) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  mou = { el, dx: e.clientX - (r.left + r.width / 2), dy: e.clientY - (r.top + r.height / 2) };
  el.classList.add("arrossegant");
  el.setPointerCapture?.(e.pointerId);
});
document.addEventListener("pointermove", e => {
  if (!mou) return;
  const c = plan.getBoundingClientRect();
  // Mentre s'arrossega la targeta viu al plànol, encara que vingui de la
  // banqueta: així se segueix el dit sense saltar.
  if (mou.el.parentNode !== plan) { plan.appendChild(mou.el); }
  let x = ((e.clientX - mou.dx - c.left) / c.width) * 100;
  let y = ((e.clientY - mou.dy - c.top) / c.height) * 100;
  // Amb la vista girada, el que el dit veu a dalt a l'esquerra és a baix a
  // la dreta del plànol de debò, que és el que es desa.
  if (aula.classList.contains("vista-prof")) { x = 100 - x; y = 100 - y; }
  x = Math.min(100, Math.max(0, x)); y = Math.min(100, Math.max(0, y));
  mou.el.style.left = x + "%";
  mou.el.style.top = y + "%";
  marcaDiana(llocProper(x, y, false));
});
document.addEventListener("pointerup", e => {
  if (!mou) return;
  const { el } = mou; mou = null;
  el.classList.remove("arrossegant");
  marcaDiana(null);
  const c = plan.getBoundingClientRect();
  const fora = e.clientY > c.bottom || e.clientX < c.left || e.clientX > c.right
            || e.clientY < c.top;
  if (fora) {
    delete POS[el.dataset.id];
    el.style.left = el.style.top = "";
    banqueta.appendChild(el);
  } else {
    // La targeta cau al pupitre, no on hagi quedat el dit. Si el pupitre ja
    // té algú s'intercanvien, que és el que vols quan mous dos alumnes de
    // lloc. Si venia de la banqueta no hi ha ningú amb qui bescanviar-se, o
    // sigui que busca el pupitre lliure més proper i no treu ningú.
    const id = el.dataset.id, venia = POS[id];
    const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    const on = venia ? llocProper(x, y, false)
                     : llocProper(x, y, true, id) || llocProper(x, y, false);
    const altre = ocupant(on, id);
    // Sense pupitre de sortida no hi ha bescanvi possible: només passa si
    // l'aula està plena, i aleshores val més deixar-los junts que treure'n un.
    if (altre && venia) POS[altre] = venia;
    POS[id] = on;
    pinta();
  }
  aplicaEstil();          // amb la foto gran, les cares s'ajusten al nou lloc
  estat.className = "estat"; estat.textContent = "Sense desar";
});

// ── Accions ─────────────────────────────────────────────────────
// L'estil de les targetes i la vista es recorden: segons si treballes a la
// pantalla, projectes o imprimeixes vols una cosa o una altra, i no té sentit
// tornar-ho a triar cada vegada.
const mida = document.getElementById("mida");
const fotos = document.getElementById("fotos");
const vistaProf = document.getElementById("vista-prof");
const aula = document.querySelector(".aula");
try {
  mida.value = localStorage.getItem("tutoria:mida") || "16";
  vistaProf.checked = localStorage.getItem("tutoria:vista-prof") === "1";
} catch (e) {}

// Amb la foto gran l'amplada no és fixa: es busca la més gran amb què cap
// parella de cares se sobreposi. Si les files van separades les cares es fan
// grosses, i si n'ajuntes dues s'encongeixen soles. El plànol és 4:5 i la
// fotografia fa 192/127 d'alt per ample, o sigui que una targeta de F%
// d'ample n'ocupa F·1,21% d'alt.
const ALT_FOTO = (192 / 127) * (4 / 5);
function ampleFoto() {
  const p = Object.values(POS);
  if (p.length < 2) return 19;
  // El terra de 9% és a posta: si dos llocs queden l'un damunt de l'altre
  // val més que aquelles dues cares es toquin que no pas que les vint-i-cinc
  // es facin diminutes per una targeta mal deixada.
  for (let f = 19; f > 9; f -= 0.25) {
    const alt = f * ALT_FOTO;
    let xoc = false;
    for (let i = 0; i < p.length && !xoc; i++)
      for (let j = i + 1; j < p.length; j++)
        if (Math.abs(p[i].x - p[j].x) < f && Math.abs(p[i].y - p[j].y) < alt) { xoc = true; break; }
    if (!xoc) return f;
  }
  return 9;
}

function aplicaEstil() {
  const gran = mida.value === "foto";
  fotos.disabled = gran;                 // amb foto gran, treure-les no té sentit
  plan.classList.toggle("foto-gran", gran);
  plan.classList.toggle("sense-fotos", !gran && !fotos.checked);
  plan.style.setProperty("--fitxa", (gran ? ampleFoto() : mida.value) + "%");
  aula.classList.toggle("vista-prof", vistaProf.checked);
  // El navegador en fa de recanvi: és el que val per a una distribució que
  // encara no té vista desada, i per si obres la pàgina sense cap.
  try {
    localStorage.setItem("tutoria:mida", mida.value);
    localStorage.setItem("tutoria:vista-prof", vistaProf.checked ? "1" : "0");
  } catch (e) {}
}

// Com es veu ara mateix, per desar-ho amb la distribució.
const vistaActual = () => ({
  mida: mida.value, fotos: fotos.checked, girada: vistaProf.checked });

// La vista que ve de la base. Si la distribució no en té —encara no s'ha
// desat, o no s'ha passat tutoria_aula_vista.sql— es queda la del navegador.
function aplicaVistaDesada(txt) {
  let v = null;
  try { v = JSON.parse(txt || "null"); } catch (e) {}
  if (v && typeof v === "object") {
    if (v.mida) mida.value = v.mida;
    if ("fotos" in v) fotos.checked = !!v.fotos;
    if ("girada" in v) vistaProf.checked = !!v.girada;
  }
  aplicaEstil();
}

// Canviar com es mira és un canvi de la distribució, com moure una targeta.
const canviaEstil = () => {
  aplicaEstil();
  if (AULA) { estat.className = "estat"; estat.textContent = "Sense desar"; }
};
mida.onchange = canviaEstil;
fotos.onchange = canviaEstil;
vistaProf.onchange = canviaEstil;
aplicaEstil();

// Per ordre de llista, com a punt de partida per anar movent des d'aquí en
// comptes de col·locar-los un a un. El quadrat és el mateix en els dos casos;
// el que canvia és per on avança la llista. Per files, el 1 i el 2 queden de
// costat; per columnes, un darrere l'altre. Amb els germans, els que xerren o
// els repetits de cognom, saber quina de les dues et deixa la classe més
// tranquil·la estalvia mitja hora d'arrossegar targetes.
function colloca(perColumnes) {
  // Files que ocupa realment el grup: amb 25 alumnes són cinc, i per columnes
  // en surten cinc de cinc en comptes de quatre de sis i una cua.
  const files = Math.min(FILES, Math.max(1, Math.ceil(ALUMNES.length / PER_FILA)));
  ALUMNES.forEach((a, i) => {
    // Els que no caben dins l'aula van a la fila de sota, i ja els mouràs tu.
    const [col, fila] = perColumnes && i < files * PER_FILA
      ? [Math.floor(i / files), i % files]
      : [i % PER_FILA, Math.floor(i / PER_FILA)];
    POS[a.id] = lloc(col, fila);
  });
  pinta();
  estat.className = "estat"; estat.textContent = "Sense desar";
}
document.getElementById("ordena").onclick = () => colloca(false);
document.getElementById("ordena-col").onclick = () => colloca(true);

document.getElementById("imprimir").onclick = () => window.print();

document.getElementById("desa").onclick = async () => {
  if (!AULA) { estat.className = "estat err"; estat.textContent = "Crea una distribució primer."; return; }
  const b = document.getElementById("desa");
  b.disabled = true; estat.className = "estat"; estat.textContent = "Desant…";
  try {
    await api("/tutoria/api/aula", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ id: AULA.id, nom: AULA.nom, grup: GRUP, curs: CURS,
                             posicions: POS, vista: vistaActual() }),
    });
    estat.className = "estat ok"; estat.textContent = "Desat";
  } catch (e) { estat.className = "estat err"; estat.textContent = e.message; }
  finally { b.disabled = false; }
};

document.getElementById("crea").onclick = async () => {
  const nom = document.getElementById("nom-nova").value.trim();
  if (!nom) { estat.className = "estat err"; estat.textContent = "Posa-li un nom."; return; }
  try {
    const r = await api("/tutoria/api/aula", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ nom, grup: GRUP, curs: CURS, posicions: {} }),
    });
    await carregaLlista(r.id);
    document.getElementById("nom-nova").value = "";
  } catch (e) { estat.className = "estat err"; estat.textContent = e.message; }
};

document.getElementById("quina").onchange = e => obre(e.target.value);

async function obre(id) {
  if (!id) { AULA = null; POS = {}; pinta(); return; }
  const { aula } = await api("/tutoria/api/aula?id=" + encodeURIComponent(id));
  AULA = aula;
  try { POS = JSON.parse(aula.posicions || "{}"); } catch (e) { POS = {}; }
  aplicaVistaDesada(aula.vista);
  pinta();
  estat.className = "estat";
  estat.textContent = aula.updated_at
    ? "Desat: " + String(aula.updated_at).slice(0, 16).replace("T", " ") : "";
}

async function carregaLlista(seleccionar) {
  const { aules } = await api("/tutoria/api/aula?grup=" + GRUP);
  const sel = document.getElementById("quina");
  sel.innerHTML = aules.length
    ? aules.map(a => `<option value="${esc(a.id)}">${esc(a.nom)}</option>`).join("")
    : '<option value="">— cap distribució —</option>';
  if (seleccionar) sel.value = seleccionar;
  await obre(sel.value);
}

(async () => {
  try {
    const d = await api("/tutoria/api/alumnes?grup=" + GRUP);
    ALUMNES = d.alumnes || [];
    await carregaLlista();
  } catch (e) {
    plan.innerHTML = `<p style="padding:1rem;color:#666">${e.status === 401
      ? "La sessió ha caducat." : esc(e.message)}</p>`;
  }
})();
</script>
