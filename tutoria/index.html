<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Tutoria 2n ESO E — Àlex Reyes</title>
<script>(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);else document.documentElement.setAttribute('data-theme','light');})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  .tut-bar { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .tut-bar input { flex:1; min-width:200px; padding:0.55rem 0.8rem; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-size:0.95rem; }
  .orla { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:1rem; }
  .al { display:block; text-decoration:none; color:inherit; background:var(--bg-subtle);
    border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
    transition:border-color .15s, transform .15s; }
  .al:hover { border-color:var(--border-strong); transform:translateY(-2px); }
  .al-foto { width:100%; aspect-ratio:127/192; object-fit:cover; display:block; background:var(--bg); }
  .al-buit { display:flex; align-items:center; justify-content:center; font-size:2rem; color:var(--text-faint); }
  .al-cos { padding:0.6rem 0.7rem; }
  .al-num { font-family:var(--mono); font-size:0.72rem; color:var(--text-faint); }
  .al-nom { font-size:0.88rem; font-weight:600; line-height:1.25; margin:0.15rem 0 0; }
  .al-cog { font-size:0.8rem; color:var(--text-soft); line-height:1.25; }
  .al-marca { font-family:var(--mono); font-size:0.68rem; color:#b45309; }
  .avis { display:flex; gap:.7rem; padding:.8rem 1rem; margin-bottom:1.5rem; font-size:.88rem;
    border:1px solid var(--border); border-left:3px solid #0f766e; border-radius:var(--radius-sm);
    background:var(--bg-subtle); color:var(--text-soft); }
  .buit { padding:2.5rem; text-align:center; color:var(--text-faint); border:1px dashed var(--border);
    border-radius:var(--radius); }
</style>
</head>
<body>
<main>
  <div class="container" style="padding-top:2.5rem;padding-bottom:4rem">

    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap">
      <div>
        <span class="section-label">Tutoria · Curs 2026&ndash;27</span>
        <h1 style="margin:0.3rem 0 0.4rem">2n ESO E</h1>
      </div>
      <a href="/tutoria/api/logout" style="font-size:0.88rem">Tancar sessió</a>
    </div>

    <div class="avis">
      <span aria-hidden="true">🔒</span>
      <span>Dades personals de menors. No comparteixis captures ni deixis la sessió
      oberta en equips compartits.</span>
    </div>

    <div class="tut-bar">
      <input id="q" type="search" placeholder="Cerca per nom o cognom…" autocomplete="off">
      <span id="cnt" style="font-size:0.85rem;color:var(--text-faint)"></span>
    </div>

    <div id="orla" class="orla"></div>
    <p id="estat" style="color:var(--text-faint);font-size:0.9rem">Carregant…</p>

  </div>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let ALUMNES = [];

function pinta(list) {
  const cont = document.getElementById("orla");
  document.getElementById("cnt").textContent =
    list.length === ALUMNES.length ? `${list.length} alumnes` : `${list.length} de ${ALUMNES.length}`;
  if (!list.length) {
    cont.innerHTML = '<p class="buit">Cap alumne coincideix amb la cerca.</p>';
    return;
  }
  cont.innerHTML = list.map(a => {
    const foto = a.foto
      ? `<img class="al-foto" src="/tutoria/api/foto?id=${encodeURIComponent(a.id)}" alt="" loading="lazy">`
      : `<div class="al-foto al-buit" aria-hidden="true">👤</div>`;
    const marca = a.marca ? ` <span class="al-marca">${esc(a.marca)}</span>` : "";
    return `<a class="al" href="/tutoria/fitxa/?id=${encodeURIComponent(a.id)}">
      ${foto}
      <div class="al-cos">
        <span class="al-num">${a.num}</span>${marca}
        <p class="al-nom">${esc(a.nom)}</p>
        <div class="al-cog">${esc(a.cognoms)}</div>
      </div>
    </a>`;
  }).join("");
}

function norm(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

document.getElementById("q").addEventListener("input", e => {
  const q = norm(e.target.value.trim());
  pinta(!q ? ALUMNES
          : ALUMNES.filter(a => norm(a.nom + " " + a.cognoms).includes(q)));
});

fetch("/tutoria/api/alumnes?grup=2ESO-E", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    ALUMNES = d.alumnes || [];
    document.getElementById("estat").remove();
    if (!ALUMNES.length) {
      document.getElementById("orla").innerHTML =
        '<p class="buit">Encara no hi ha alumnes carregats.<br>' +
        'Executa <code>scripts/tutoria_import_orla.py</code> amb l\'orla del centre.</p>';
      return;
    }
    pinta(ALUMNES);
  })
  .catch(err => {
    document.getElementById("estat").textContent =
      err === 401 ? "La sessió ha caducat. Torna a entrar."
                  : "No s'han pogut carregar les dades.";
  });
</script>
</body>
</html>
